<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">LoulanYue open-source systems engineer</title>
  <desc id="desc">A dark terminal-inspired profile banner with a cyan circuit grid and engineering workflow signal.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A10"/>
      <stop offset="0.58" stop-color="#071522"/>
      <stop offset="1" stop-color="#041019"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#7CF29A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#123044" stroke-width="1" opacity=".42"/>
      <circle cx="0" cy="0" r="1.4" fill="#1E5066" opacity=".7"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#16475B" stroke-width="2"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <path d="M0 262H454L486 230H730L760 260H1200" fill="none" stroke="#0B4050" stroke-width="1.5"/>
  <path d="M0 270H462L494 238H722L752 268H1200" fill="none" stroke="url(#signal)" stroke-width="2" opacity=".76"/>
  <circle cx="493" cy="238" r="4" fill="#00E5FF" filter="url(#glow)"/>
  <circle cx="723" cy="238" r="4" fill="#7CF29A" filter="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="54" fill="#00E5FF" font-size="14" letter-spacing="3">[ PROFILE NODE / OSS-01 ]</text>
    <text x="64" y="141" fill="#EDF8FF" font-size="70" font-weight="700" letter-spacing="6">LOULANYUE</text>
    <rect x="64" y="163" width="456" height="2" fill="url(#signal)"/>
    <text x="64" y="198" fill="#7CF29A" font-size="21" font-weight="600" letter-spacing="2.6">OPEN SOURCE SYSTEMS ENGINEER</text>
    <text x="64" y="231" fill="#8EABB8" font-size="15">&gt; spec-driven development / multi-agent delivery / verified change</text>
    <text x="64" y="296" fill="#426677" font-size="12" letter-spacing="2">MODE: PUBLIC  //  SIGNAL: VERIFIED  //  LOOP: MAINTAIN</text>
  </g>

  <g transform="translate(1000 144)" fill="none">
    <circle r="92" stroke="#123E51" stroke-width="1.5"/>
    <circle r="66" stroke="#164B5D" stroke-width="1" stroke-dasharray="5 7"/>
    <circle r="38" stroke="#1A6070" stroke-width="1"/>
    <path d="M-92 0H92M0-92V92" stroke="#123E51" stroke-width="1"/>
    <path d="M0 0L62-47" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"/>
    <circle cx="62" cy="-47" r="5" fill="#7CF29A" stroke="none" filter="url(#glow)"/>
    <circle r="7" fill="#00E5FF" stroke="none" filter="url(#glow)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6">
    <text x="920" y="43" fill="#426677">SYSTEM TELEMETRY</text>
    <text x="920" y="61" fill="#7CF29A">● ONLINE</text>
    <text x="914" y="279" fill="#426677">SPEC → BUILD → VERIFY → SHIP</text>
  </g>
</svg>

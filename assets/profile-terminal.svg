<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">LoulanYue open-source AI systems engineer</title>
  <desc id="desc">A light bilingual systems console positioning open infrastructure for the agentic era with live GitHub telemetry.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFEFF"/>
      <stop offset=".52" stop-color="#F1F9FC"/>
      <stop offset="1" stop-color="#E6F4F8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A9DB2"/>
      <stop offset="1" stop-color="#63C6A7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CBE2EB" stroke-width="1" opacity=".55"/>
      <circle cx="0" cy="0" r="1.2" fill="#A9D1DE" opacity=".65"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#397E91" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#canvas)"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#B6D7E2" stroke-width="2"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)" opacity=".74"/>

  <path d="M0 266H420L452 238H650L680 266H1200" fill="none" stroke="#C6E2E9" stroke-width="1.5"/>
  <path d="M0 274H428L460 246H642L672 274H1200" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".72"/>
  <circle cx="460" cy="246" r="4" fill="#2A9DB2"/>
  <circle cx="642" cy="246" r="4" fill="#63C6A7"/>

  <g font-family="'Avenir Next', 'PingFang SC', 'Noto Sans CJK SC', ui-sans-serif, sans-serif">
    <text x="58" y="51" fill="#2A879B" font-size="13" font-weight="700" letter-spacing="3">[ OPEN SYSTEMS / OSS-01 ]</text>
    <text x="58" y="132" fill="#123E52" font-size="66" font-weight="700" letter-spacing="5">LOULANYUE</text>
    <rect x="58" y="152" width="500" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="58" y="188" fill="#0B7185" font-size="20" font-weight="700" letter-spacing="1.7">OPEN-SOURCE AI SYSTEMS ENGINEER</text>
    <text x="58" y="219" fill="#467688" font-size="17" font-weight="600">面向智能体时代的开放系统工程 · 规格 · 运行时 · 可信交付</text>
    <text x="58" y="296" fill="#789EAB" font-size="11" font-weight="700" letter-spacing="2">DESIGN  →  CONTRIBUTE  →  VERIFY  →  STEWARD</text>
    <text id="last-updated-banner" x="1142" y="296" text-anchor="end" fill="#789EAB" font-size="10.5" font-weight="700" letter-spacing="1.4">UPDATED 2026-07-25 UTC</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="40" width="454" height="210" rx="20" fill="#FFFFFF" fill-opacity=".9" stroke="#C5E1E9"/>
  </g>

  <g font-family="'Avenir Next', 'PingFang SC', 'Noto Sans CJK SC', ui-sans-serif, sans-serif">
    <text x="720" y="75" fill="#648C99" font-size="11" font-weight="700" letter-spacing="2.2">LIVE TELEMETRY / 实时数据</text>
    <circle cx="1112" cy="70" r="5" fill="#63C6A7"/>

    <g transform="translate(720 96)">
      <rect width="126" height="120" rx="14" fill="#F2FAFC" stroke="#D4E9EF"/>
      <text id="total-stars" x="63" y="55" text-anchor="middle" fill="#123E52" font-size="31" font-weight="750">2,244</text>
      <text x="63" y="82" text-anchor="middle" fill="#2A879B" font-size="10" font-weight="700" letter-spacing="1.4">TOTAL STARS</text>
      <text x="63" y="101" text-anchor="middle" fill="#789EAB" font-size="11">总星标</text>
    </g>

    <g transform="translate(858 96)">
      <rect width="120" height="120" rx="14" fill="#F2FAFC" stroke="#D4E9EF"/>
      <text id="project-count" x="60" y="55" text-anchor="middle" fill="#123E52" font-size="31" font-weight="750">13</text>
      <text x="60" y="82" text-anchor="middle" fill="#2A879B" font-size="10" font-weight="700" letter-spacing="1.4">PROJECTS</text>
      <text x="60" y="101" text-anchor="middle" fill="#789EAB" font-size="11">公开项目</text>
    </g>

    <g transform="translate(990 96)">
      <rect width="126" height="120" rx="14" fill="#F2FAFC" stroke="#D4E9EF"/>
      <text id="follower-count" x="63" y="55" text-anchor="middle" fill="#123E52" font-size="31" font-weight="750">154</text>
      <text x="63" y="82" text-anchor="middle" fill="#2A879B" font-size="10" font-weight="700" letter-spacing="1.4">FOLLOWERS</text>
      <text x="63" y="101" text-anchor="middle" fill="#789EAB" font-size="11">关注者</text>
    </g>
  </g>
</svg>

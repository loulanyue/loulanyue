name: Update Profile Stats

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00) 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate stats and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          USERNAME="loulanyue"

          # ── 1. 获取 Followers 和 Public Repos ────────────────────────────
          USER_DATA=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$USERNAME")

          FOLLOWERS=$(echo "$USER_DATA" | jq -r '.followers')
          PUBLIC_REPOS=$(echo "$USER_DATA" | jq -r '.public_repos')

          echo "Followers:    $FOLLOWERS"
          echo "Public Repos: $PUBLIC_REPOS"

          # ── 2. 汇总所有公开仓库的 Stars ───────────────────────────────────
          TOTAL_STARS=0
          PAGE=1
          while true; do
            REPOS=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$USERNAME/repos?per_page=100&page=$PAGE")

            COUNT=$(echo "$REPOS" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            PAGE_STARS=$(echo "$REPOS" | jq '[.[].stargazers_count] | add // 0')
            TOTAL_STARS=$((TOTAL_STARS + PAGE_STARS))
            PAGE=$((PAGE + 1))
          done

          echo "Total Stars:  $TOTAL_STARS"

          # ── 3. 更新 README.md 中的三个徽章数字 ───────────────────────────
          # 匹配形如 Total%20Stars-<数字>%20⭐ 的模式
          sed -i \
            "s|Total%20Stars-[0-9]*%20⭐|Total%20Stars-${TOTAL_STARS}%20⭐|g" \
            README.md

          # 匹配形如 Public%20Repos-<数字>- 的模式
          sed -i \
            "s|Public%20Repos-[0-9]*-|Public%20Repos-${PUBLIC_REPOS}-|g" \
            README.md

          # Followers 徽章使用 shields.io 动态端点，无需替换数字
          # 如果仍使用静态徽章则替换（兜底）
          sed -i \
            "s|Followers-[0-9]*-|Followers-${FOLLOWERS}-|g" \
            README.md

          echo "README updated."

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git add README.md
            git commit -m "chore(profile): auto-update stars/repos/followers stats [skip ci]"
            git push
            echo "Pushed updated stats."
          fi

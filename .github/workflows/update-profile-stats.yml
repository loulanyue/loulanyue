name: Refresh profile telemetry

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/update-profile-stats.mjs

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Refresh repository telemetry
        run: node scripts/update-profile-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed telemetry
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile telemetry is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile telemetry"
          git push

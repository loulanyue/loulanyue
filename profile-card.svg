  <circle cx="770.0" cy="130.0" r="90.0" fill="none" stroke="#1a9e8f" stroke-width="1.2" stroke-opacity="0.4"/>
<path d="M 770.00,107.50 L 791.40,123.05 L 783.23,148.20 L 756.77,148.20 L 748.60,123.05 Z" fill="none" stroke="#1a9e8f" stroke-width="0.6" stroke-opacity="0.3"/>

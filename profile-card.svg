<path d="M 770.00,62.50 L 834.20,109.14 L 809.68,184.61 L 730.32,184.61 L 705.80,109.14 Z" fill="none" stroke="#1a9e8f" stroke-width="0.6" stroke-opacity="0.3"/>
<path d="M 770.00,40.00 L 855.60,102.19 L 822.90,202.81 L 717.10,202.81 L 684.40,102.19 Z" fill="none" stroke="#1a9e8f" stroke-width="0.6" stroke-opacity="0.3"/>
<line x1="770.00" y1="130.00" x2="770.00" y2="40.00" stroke="#1a9e8f" stroke-width="0.5" stroke-opacity="0.35"/>
<line x1="770.00" y1="130.00" x2="855.60" y2="102.19" stroke="#1a9e8f" stroke-width="0.5" stroke-opacity="0.35"/>
<line x1="770.00" y1="130.00" x2="822.90" y2="202.81" stroke="#1a9e8f" stroke-width="0.5" stroke-opacity="0.35"/>
<line x1="770.00" y1="130.00" x2="717.10" y2="202.81" stroke="#1a9e8f" stroke-width="0.5" stroke-opacity="0.35"/>
<line x1="770.00" y1="130.00" x2="684.40" y2="102.19" stroke="#1a9e8f" stroke-width="0.5" stroke-opacity="0.35"/>
<text x="770.0" y="22.0" font-family="monospace" font-size="6.5" fill="#1a9e8f" text-anchor="middle" opacity="0.7">N 000°</text>
<text x="876.0" y="130.0" font-family="monospace" font-size="6.5" fill="#1a9e8f" text-anchor="start" opacity="0.7">E 090°</text>
<text x="770.0" y="244.0" font-family="monospace" font-size="6.5" fill="#1a9e8f" text-anchor="middle" opacity="0.7">S 180°</text>
<text x="664.0" y="130.0" font-family="monospace" font-size="6.5" fill="#1a9e8f" text-anchor="end" opacity="0.7">W 270°</text>
<path d="M 770.00,65.20 L 819.65,113.87 L 804.39,177.33 L 727.68,188.25 L 722.92,114.70 Z" fill="#1a9e8f" fill-opacity="0.18" stroke="#1a9e8f" stroke-width="1.5"/>
